<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문 받는 화면 (선생님용)</title>
<style>
  :root{ --main:#2f6fd0; --ink:#22303f; --line:#e2e8f0; --good:#2e9e5b; --amber:#e8722c; }
  *{box-sizing:border-box; font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;}
  html,body{margin:0; background:#eef2f7; color:var(--ink);}
  header{background:var(--main); color:#fff; padding:16px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  header h1{margin:0; font-size:26px;}
  .right{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .pill{background:rgba(255,255,255,.18); border-radius:20px; padding:8px 14px; font-size:15px; font-weight:700;}
  .dot{display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; vertical-align:middle; background:#ffd23f;}
  .dot.on{background:#7CFFB2;} .dot.off{background:#ff8a7a;}
  .code-in{border:none; border-radius:10px; padding:8px 12px; font-size:16px; width:230px;}
  .btn{border:none; border-radius:12px; padding:9px 16px; font-size:15px; font-weight:800; cursor:pointer; background:#fff; color:var(--main);}

  .summary{display:flex; gap:14px; padding:16px 22px; flex-wrap:wrap;}
  .stat{background:#fff; border-radius:16px; padding:14px 22px; min-width:150px; box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .stat .n{font-size:34px; font-weight:900;}
  .stat .l{font-size:15px; color:#6b7787; font-weight:700;}
  .stat.new .n{color:var(--amber);} .stat.done .n{color:var(--good);} .stat.money .n{color:var(--main);}

  .board{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; padding:6px 22px 40px;}
  .order{background:#fff; border-radius:18px; padding:18px 20px; box-shadow:0 4px 14px rgba(0,0,0,.08); border-top:8px solid var(--amber); animation:pop .25s ease;}
  @keyframes pop{from{transform:scale(.94);opacity:0} to{transform:scale(1);opacity:1}}
  .order .top{display:flex; align-items:baseline; justify-content:space-between;}
  .order .no{font-size:40px; font-weight:900; color:var(--amber);}
  .order .time{font-size:15px; color:#8a97a6; font-weight:700;}
  .order .dev{display:inline-block; margin:8px 0 4px; background:#eef4ff; color:var(--main); border-radius:10px; padding:5px 12px; font-size:16px; font-weight:800;}
  .order ul{list-style:none; margin:10px 0; padding:0;}
  .order li{display:flex; justify-content:space-between; font-size:21px; padding:6px 0; border-bottom:1px dashed var(--line);}
  .order li b{font-weight:800;}
  .order .tot{display:flex; justify-content:space-between; font-size:24px; font-weight:900; margin:10px 0;}
  .order .pay{font-size:16px; color:#6b7787; font-weight:700;}
  .order .done-btn{width:100%; margin-top:12px; background:var(--good); color:#fff; border:none; border-radius:14px; padding:16px; font-size:22px; font-weight:900; cursor:pointer;}
  .order.done{opacity:.5; border-top-color:var(--good);}
  .order.done .done-btn{background:#9aa7b4;}
  .empty{grid-column:1/-1; text-align:center; color:#9aa7b4; font-size:22px; padding:60px 0;}
  .credit{text-align:center; color:#9aa7b4; font-size:14px; padding:10px 0 26px;}
</style>
</head>
<body>
<header>
  <h1>🧾 주문 받는 화면</h1>
  <div class="right">
    <span class="pill"><span class="dot" id="dot"></span><span id="conn">연결 중...</span></span>
    <input class="code-in" id="code" placeholder="매장 코드" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn" onclick="applyCode()">연결</button>
    <button class="btn" onclick="toggleSound()" id="soundBtn">🔔 소리 켜기</button>
  </div>
</header>

<div class="summary">
  <div class="stat new"><div class="n" id="sNew">0</div><div class="l">대기 주문</div></div>
  <div class="stat done"><div class="n" id="sDone">0</div><div class="l">완료</div></div>
  <div class="stat money"><div class="n" id="sMoney">0원</div><div class="l">총 판매액</div></div>
</div>

<div class="board" id="board"><div class="empty" id="empty">아직 들어온 주문이 없어요. 학생이 결제하면 여기에 떠요.</div></div>

<div class="credit">제작: 김수빈 선생님</div>

<script>
const DEFAULT_CODE='banghak-bakery-7k29xa';   // 키오스크와 동일해야 함
let store = localStorage.getItem('bakery_store_code_teacher') || DEFAULT_CODE;
let es=null, soundOn=false;
const seen=new Set();
let stats={newCount:0, doneCount:0, money:0};

function won(n){ return n.toLocaleString('ko-KR')+'원'; }
function setConn(ok,msg){ document.getElementById('dot').className='dot '+(ok?'on':'off'); document.getElementById('conn').textContent=msg||(ok?'연결됨':'연결 끊김'); }

function connect(){
  if(es){ es.close(); es=null; }
  setConn(false,'연결 중...');
  es=new EventSource('https://ntfy.sh/'+encodeURIComponent(store)+'/sse');
  es.onopen=()=>setConn(true,'연결됨 · '+store);
  es.onerror=()=>setConn(false,'연결 끊김 (재시도 중)');
  es.onmessage=(e)=>{
    let d; try{ d=JSON.parse(e.data); }catch(x){ return; }
    if(d.event!=='message' || !d.message) return;
    let order; try{ order=JSON.parse(d.message); }catch(x){ return; }
    if(!order || !order.id || seen.has(order.id)) return;
    seen.add(order.id);
    addOrder(order);
  };
}
function applyCode(){
  const v=(document.getElementById('code').value||DEFAULT_CODE).trim();
  store=v; localStorage.setItem('bakery_store_code_teacher',store);
  connect();
}
function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('soundBtn').textContent=soundOn?'🔔 소리 켜짐':'🔕 소리 꺼짐';
  if(soundOn) beep();
}
function beep(){
  try{ const ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination); o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.001,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.4,ac.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.35);
    o.start(); o.stop(ac.currentTime+0.36);
  }catch(e){}
}
function addOrder(order){
  document.getElementById('empty')?.remove();
  stats.newCount++; stats.money+=Number(order.total)||0; refreshStats();
  if(soundOn) beep();
  const card=document.createElement('div'); card.className='order'; card.id='o-'+order.id;
  const items=(order.items||[]).map(it=>`<li><span>${it.name} × ${it.qty}</span><b>${won((it.price||0)*(it.qty||0))}</b></li>`).join('');
  card.innerHTML=`
    <div class="top"><span class="no">${order.no}번</span><span class="time">${order.time||''}</span></div>
    ${order.device?`<div class="dev">${order.device}</div>`:''}
    <ul>${items}</ul>
    <div class="tot"><span>합계</span><span>${won(order.total)}</span></div>
    <div class="pay">결제수단: ${order.method||'-'}</div>
    <button class="done-btn" onclick="markDone('${order.id}')">✔ 빵 전달 완료</button>`;
  document.getElementById('board').prepend(card);
}
function markDone(id){
  const c=document.getElementById('o-'+id); if(!c||c.classList.contains('done')) return;
  c.classList.add('done'); c.querySelector('.done-btn').textContent='완료됨';
  stats.newCount=Math.max(0,stats.newCount-1); stats.doneCount++; refreshStats();
}
function refreshStats(){
  document.getElementById('sNew').textContent=stats.newCount;
  document.getElementById('sDone').textContent=stats.doneCount;
  document.getElementById('sMoney').textContent=won(stats.money);
}

document.getElementById('code').value=store;
connect();
</script>
</body>
</html>
